openapi: 3.0.3
info:
  title: UniEquip API
  version: "1.0"
  description: REST API of UniEquip, a university equipment lending system.

servers:
  - url: http://localhost:8080
    description: Local environment

tags:
  - name: Auth
    description: Registration and login (F1)
  - name: Categories
    description: Equipment categories (F2, F8)
  - name: Departments
    description: Departments (F8)
  - name: HazardClasses
    description: Hazard classes and required safety levels (F8)
  - name: Equipment
    description: Equipment catalog, attributes, and availability (F2, F3, F8)
  - name: Reservations
    description: Lending requests, status history, issuing and returning equipment (F4-F7)
  - name: Users
    description: User management and clearance levels (F8)
  - name: Reports
    description: Reports (F9)

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- Auth
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a user (F1)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created (role USER)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and receive a JWT token (F1)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------- Categories
  /api/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List categories (F2)
      security: []
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a category (F8, ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/categories/{id}:
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Get category by ID
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Categories]
      operationId: updateCategory
      summary: Update a category (F8, ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Delete a category (F8, ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Category deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Category still contains equipment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --------------------------------------------------------- Departments
  /api/departments:
    get:
      tags: [Departments]
      operationId: listDepartments
      summary: List departments
      security: []
      responses:
        '200':
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentResponse'
    post:
      tags: [Departments]
      operationId: createDepartment
      summary: Create a department (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/departments/{id}:
    get:
      tags: [Departments]
      operationId: getDepartment
      summary: Get department by ID
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Department details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Departments]
      operationId: updateDepartment
      summary: Update a department (ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Departments]
      operationId: deleteDepartment
      summary: Delete a department (ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Department deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Department still contains equipment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ------------------------------------------------------- Hazard Classes
  /api/hazard-classes:
    get:
      tags: [HazardClasses]
      operationId: listHazardClasses
      summary: List hazard classes
      security: []
      responses:
        '200':
          description: List of hazard classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HazardClassResponse'
    post:
      tags: [HazardClasses]
      operationId: createHazardClass
      summary: Create a hazard class (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HazardClassRequest'
      responses:
        '201':
          description: Hazard class created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HazardClassResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/hazard-classes/{id}:
    get:
      tags: [HazardClasses]
      operationId: getHazardClass
      summary: Get hazard class by ID
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Hazard class details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HazardClassResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [HazardClasses]
      operationId: updateHazardClass
      summary: Update a hazard class (ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HazardClassRequest'
      responses:
        '200':
          description: Hazard class updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HazardClassResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [HazardClasses]
      operationId: deleteHazardClass
      summary: Delete a hazard class (ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Hazard class deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Hazard class still referenced by equipment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ----------------------------------------------------------- Equipment
  /api/equipment:
    get:
      tags: [Equipment]
      operationId: listEquipment
      summary: List and search equipment (F2)
      security: []
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
        - name: departmentId
          in: query
          schema:
            type: integer
            format: int64
        - name: hazardClassId
          in: query
          schema:
            type: integer
            format: int64
        - name: q
          in: query
          description: Search phrase matched against name and inventory number
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of equipment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentPage'
    post:
      tags: [Equipment]
      operationId: createEquipment
      summary: Add equipment (F8, ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentRequest'
      responses:
        '201':
          description: Equipment added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Inventory number already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/equipment/{id}:
    get:
      tags: [Equipment]
      operationId: getEquipment
      summary: Get equipment details (F2)
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Equipment item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Equipment]
      operationId: updateEquipment
      summary: Update equipment, including its status (F8, ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentRequest'
      responses:
        '200':
          description: Equipment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Inventory number already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Equipment]
      operationId: deleteEquipment
      summary: Delete equipment (F8, ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Equipment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Equipment is referenced by reservations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/equipment/{id}/availability:
    get:
      tags: [Equipment]
      operationId: checkAvailability
      summary: Check equipment availability in a date range (F3)
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Availability information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------- Reservations
  /api/reservations:
    post:
      tags: [Reservations]
      operationId: createReservation
      summary: Submit a lending request (F4, USER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Request submitted (status PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Equipment is booked in the requested period, not available, or clearance level too low
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Reservations]
      operationId: listReservations
      summary: List requests, filterable by status (F6, ADMIN)
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReservationStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of reservations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/reservations/my:
    get:
      tags: [Reservations]
      operationId: listMyReservations
      summary: Own lending history (F5, USER)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of the current user's reservations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/reservations/{id}:
    get:
      tags: [Reservations]
      operationId: getReservation
      summary: Get reservation details
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Reservation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/reservations/{id}/history:
    get:
      tags: [Reservations]
      operationId: getReservationHistory
      summary: Get status audit history for a reservation
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Reservation status change history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationArchiveResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/reservations/{id}/cancel:
    patch:
      tags: [Reservations]
      operationId: cancelReservation
      summary: Cancel own request, PENDING or APPROVED -> CANCELLED (F5, USER)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidStatus'

  /api/reservations/{id}/approve:
    patch:
      tags: [Reservations]
      operationId: approveReservation
      summary: Approve a request, PENDING -> APPROVED (F6, ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Request approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidStatus'

  /api/reservations/{id}/reject:
    patch:
      tags: [Reservations]
      operationId: rejectReservation
      summary: Reject a request, PENDING -> REJECTED (F6, ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidStatus'

  /api/reservations/{id}/issue:
    patch:
      tags: [Reservations]
      operationId: issueEquipment
      summary: Issue equipment, APPROVED -> ISSUED (F7, ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueEquipmentRequest'
      responses:
        '200':
          description: Equipment issued, issue date recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidStatus'

  /api/reservations/{id}/return:
    patch:
      tags: [Reservations]
      operationId: returnEquipment
      summary: Accept a return, ISSUED -> RETURNED (F7, ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnEquipmentRequest'
      responses:
        '200':
          description: Return accepted, return date recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidStatus'

  # --------------------------------------------------------------- Users
  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users (F8, ADMIN)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get user details (ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/role:
    patch:
      tags: [Users]
      operationId: changeUserRole
      summary: Change a user's role (F8, ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: Role changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/clearance:
    patch:
      tags: [Users]
      operationId: changeUserClearance
      summary: Change a user's clearance level (ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeClearanceRequest'
      responses:
        '200':
          description: Clearance level changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------- Reports
  /api/reports/overdue:
    get:
      tags: [Reports]
      operationId: getOverdueReport
      summary: Overdue lending report, status ISSUED with end_date in the past (F9, ADMIN)
      responses:
        '200':
          description: List of overdue loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OverdueEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      description: Page number (zero-based)
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions (wrong role)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict, e.g. duplicate of a unique value
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidStatus:
      description: Reservation status change not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ---- enums
    UserRole:
      type: string
      enum: [USER, ADMIN]
    ClearanceLevel:
      type: string
      enum: [BASIC, ADVANCED, SPECIALIST]
    EquipmentStatus:
      type: string
      enum: [AVAILABLE, IN_SERVICE, RETIRED]
    ArchiveReason:
      type: string
      enum: [CANCELLED, REJECTED]
    ReservationStatus:
      type: string
      enum: [PENDING, APPROVED, ISSUED, RETURNED]

    # ---- common
    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 409
        error:
          type: string
          example: Conflict
        message:
          type: string
          example: Equipment is booked in the requested period
        path:
          type: string

    # ---- auth and users
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          maxLength: 80
        lastName:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          format: password
          minLength: 8
        clearanceLevel:
          $ref: '#/components/schemas/ClearanceLevel'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT token for the Authorization header
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        clearanceLevel:
          $ref: '#/components/schemas/ClearanceLevel'
    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
    ChangeClearanceRequest:
      type: object
      required: [clearanceLevel]
      properties:
        clearanceLevel:
          $ref: '#/components/schemas/ClearanceLevel'
    UserPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    # ---- departments
    DepartmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        location:
          type: string
          maxLength: 150
    DepartmentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        location:
          type: string

    # ---- categories
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    # ---- hazard classes
    HazardClassRequest:
      type: object
      required: [name, requiredLevel]
      properties:
        name:
          type: string
          maxLength: 100
        requiredLevel:
          $ref: '#/components/schemas/ClearanceLevel'
        safetyInstructions:
          type: string
    HazardClassResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        requiredLevel:
          $ref: '#/components/schemas/ClearanceLevel'
        safetyInstructions:
          type: string

    # ---- equipment model and items
    EquipmentModelRequest:
      type: object
      required: [categoryId, departmentId, name]
      properties:
        categoryId:
          type: integer
          format: int64
        departmentId:
          type: integer
          format: int64
        hazardClassId:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 150
        description:
          type: string
        isConsumable:
          type: boolean
          default: false
        specs:
          type: object
          additionalProperties: true
          description: Flexible technical parameters (JSON)
    EquipmentModelResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        departmentId:
          type: integer
          format: int64
        departmentName:
          type: string
        hazardClassId:
          type: integer
          format: int64
        hazardClassName:
          type: string
        name:
          type: string
        description:
          type: string
        isConsumable:
          type: boolean
        specs:
          type: object
          additionalProperties: true
          description: Flexible technical parameters (JSON)
    EquipmentItemRequest:
      type: object
      required: [modelId, serialNumber, inventoryNumber]
      properties:
        modelId:
          type: integer
          format: int64
        serialNumber:
          type: string
          maxLength: 100
        inventoryNumber:
          type: string
          maxLength: 100
        status:
          $ref: '#/components/schemas/EquipmentStatus'
    EquipmentItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        modelId:
          type: integer
          format: int64
        modelName:
          type: string
        serialNumber:
          type: string
        inventoryNumber:
          type: string
        status:
          $ref: '#/components/schemas/EquipmentStatus'
    EquipmentRequest:
      type: object
      required: [categoryId, departmentId, name, inventoryNumber]
      properties:
        categoryId:
          type: integer
          format: int64
        departmentId:
          type: integer
          format: int64
        hazardClassId:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 150
        inventoryNumber:
          type: string
          maxLength: 100
        description:
          type: string
        status:
          $ref: '#/components/schemas/EquipmentStatus'
        specs:
          type: object
          additionalProperties: true
          description: Flexible technical parameters (JSON)
    EquipmentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        departmentId:
          type: integer
          format: int64
        departmentName:
          type: string
        hazardClassId:
          type: integer
          format: int64
        hazardClassName:
          type: string
        name:
          type: string
        inventoryNumber:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/EquipmentStatus'
        specs:
          type: object
          additionalProperties: true
          description: Flexible technical parameters (JSON)
    EquipmentPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    AvailabilityResponse:
      type: object
      properties:
        itemId:
          type: integer
          format: int64
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        available:
          type: boolean
          description: Whether the equipment item is free for the whole period
        reason:
          type: string
          nullable: true
          description: Reason for unavailability, e.g. date overlap or equipment in service

    # ---- reservations
    CreateReservationRequest:
      type: object
      required: [itemId, startDate, endDate]
      properties:
        itemId:
          type: integer
          format: int64
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    IssueEquipmentRequest:
      type: object
      properties:
        issueNote:
          type: string
          description: Note about the equipment condition when issued
    ReturnEquipmentRequest:
      type: object
      properties:
        returnNote:
          type: string
          description: Note about the equipment condition when returned
    ReservationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        userName:
          type: string
        itemId:
          type: integer
          format: int64
        modelName:
          type: string
        inventoryNumber:
          type: string
        serialNumber:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ReservationStatus'
        createdAt:
          type: string
          format: date-time
        issuedAt:
          type: string
          format: date-time
          nullable: true
        returnedAt:
          type: string
          format: date-time
          nullable: true
        issueNote:
          type: string
          nullable: true
        returnNote:
          type: string
          nullable: true
    ReservationArchiveResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        originalId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        userName:
          type: string
        itemId:
          type: integer
          format: int64
        modelName:
          type: string
        inventoryNumber:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        finalStatus:
          $ref: '#/components/schemas/ArchiveReason'
        createdAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true

    ReservationPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReservationResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    # ---- reports
    OverdueEntry:
      type: object
      properties:
        reservationId:
          type: integer
          format: int64
        userName:
          type: string
        userEmail:
          type: string
          format: email
        equipmentName:
          type: string
        inventoryNumber:
          type: string
        endDate:
          type: string
          format: date
        daysOverdue:
          type: integer
